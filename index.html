<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0b" media="(prefers-color-scheme: dark)" />

    <title>Gradely — A Simple Grade Tracker for Students</title>
    <meta
      name="description"
      content="Keep your scores, courses, and grades in one simple place. Set up grading the way your class works and see your progress at a glance."
    />
    <meta
      name="keywords"
      content="student grade tracker, grade organizer, semester grades, GPA tracker, GWA tracker, college grades, high school grades"
    />
    <meta name="author" content="Gradely" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Gradely" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gradely" />
    <meta property="og:title" content="Gradely — A Simple Grade Tracker for Students" />
    <meta
      property="og:description"
      content="Keep every score, course, and grade in one calm place. See your progress at a glance."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gradely grade tracker preview" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gradely — A Simple Grade Tracker for Students" />
    <meta
      name="twitter:description"
      content="Keep every score, course, and grade in one calm place. See your progress at a glance."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gradely-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* no-op */
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gradely",
        "url": "%VITE_SITE_URL%/",
        "description": "A simple grade tracker for students. Keep scores organized, set up grading the way each course works, and see your GPA or GWA at a glance.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern browser.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Keep scores organized by course and term",
          "Set up class and lab grading",
          "See term and semester grades",
          "Track your GPA or GWA",
          "Works on phone and desktop"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Gradely free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Gradely is free for students, with no credit card required. Create an account and start tracking your grades in minutes."
            }
          },
          {
            "@type": "Question",
            "name": "Can I set up grading the way my class does?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Choose how much quizzes, projects, exams, and lab work count, save the setup, and reuse it for other classes with the same rules."
            }
          },
          {
            "@type": "Question",
            "name": "Does Gradely calculate my GPA or GWA?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Gradely turns your percentages into the grades on your school's scale and keeps an overall average across your courses."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need a spreadsheet?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Gradely keeps your courses, scores, and averages together so you can stop maintaining separate spreadsheet tabs."
            }
          },
          {
            "@type": "Question",
            "name": "Is my grade data private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Only you can see your courses, scores, and grades."
            }
          },
          {
            "@type": "Question",
            "name": "Does Gradely work on mobile?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can add a score right after class on your phone or review your grades on a larger screen."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 40px; max-width: 640px; margin: auto">
        <h1>Gradely</h1>
        <p>
          Gradely is a simple grade tracker for students. Please enable JavaScript to use
          the app.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
