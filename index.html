<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0b" media="(prefers-color-scheme: dark)" />

    <title>Gradely — Student Grade Tracker & GWA Calculator</title>
    <meta
      name="description"
      content="Gradely is a free grade tracker for students. Build custom grading schemes, split lecture and lab weights, compute term grades, and see your GWA update in real time."
    />
    <meta
      name="keywords"
      content="grade tracker, student grade calculator, GWA calculator, GPA calculator, grading scheme, lecture lab weights, term grade, academic tracker, college grades"
    />
    <meta name="author" content="Gradely" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="Gradely" />
    <link rel="canonical" href="https://gradely.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gradely" />
    <meta property="og:title" content="Gradely — Take Control of Your Academic Performance" />
    <meta
      property="og:description"
      content="Custom grading schemes, lecture and lab weights, term-by-term computations, and real-time GWA tracking. Built for students."
    />
    <meta property="og:url" content="https://gradely.app/" />
    <meta property="og:image" content="https://gradely.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gradely student grade tracker dashboard" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gradely — Student Grade Tracker & GWA Calculator" />
    <meta
      name="twitter:description"
      content="Build the grading system your school actually uses. Track scores, term grades, and your GWA in one clean dashboard."
    />
    <meta name="twitter:image" content="https://gradely.app/og-image.png" />

    <!-- Icons & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://hhvnekdkddhusvfxadpy.supabase.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- Set the theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gradely-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* no-op */
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gradely",
        "url": "https://gradely.app/",
        "description": "A free student grade tracker with customizable grading schemes, lecture and laboratory weight splits, term computations, and real-time GWA calculations.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and a modern browser.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Custom grading schemes",
          "Lecture and laboratory weight splits",
          "Term and semester computations",
          "Real-time GWA and GPA calculations",
          "Configurable grading scale mapping",
          "Mobile-friendly grade tracking"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is Gradely free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Gradely is free for students, with no credit card required. Create an account and start tracking your grades in minutes."
            }
          },
          {
            "@type": "Question",
            "name": "Can I customize my grading weights?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can set lecture and laboratory splits, term weights, and sub-component weights such as quizzes, group discussions, chapter exams, lab manuals, and practical exams."
            }
          },
          {
            "@type": "Question",
            "name": "Does Gradely compute my GWA or GPA?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Gradely converts every percentage through the grading scale attached to your scheme, then combines subjects by unit to estimate your GWA. You can define your own scale ranges, grade points, and remarks."
            }
          },
          {
            "@type": "Question",
            "name": "Is my grade data private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Student accounts are protected with Supabase Authentication, and Row Level Security ensures you can only read and write your own schemes, subjects, and grade entries."
            }
          },
          {
            "@type": "Question",
            "name": "Does Gradely work on mobile?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The dashboard, grade entry forms, and scheme editor are fully responsive, so you can record a score right after class on your phone."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 40px; max-width: 640px; margin: auto">
        <h1>Gradely</h1>
        <p>
          Gradely is a student grade tracker with custom grading schemes and real-time GWA
          computation. Please enable JavaScript to use the app.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
